name: pixivarchive

services:
  prepare:
    image: pixivarchive:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        ALL_PROXY: ${ALL_PROXY:-}
        NO_PROXY: ${NO_PROXY:-127.0.0.1,localhost,postgres}
    pull_policy: build

  web:
    image: pixivarchive:local
    pull_policy: never

  worker:
    image: pixivarchive:local
    pull_policy: never
