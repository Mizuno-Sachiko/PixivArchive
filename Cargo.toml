[workspace]
resolver = "2"
members = [
  "crates/domain",
  "crates/db",
  "crates/pixiv",
  "crates/media",
  "crates/application",
  "crates/test-support",
  "apps/web",
  "apps/worker",
  "apps/admin",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.96"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.22"
bytes = "1"
futures-util = "0.3"
garde = { version = "0.23.0", features = ["derive", "serde", "url", "unicode"] }
http = "1"
infer = "0.22.0"
imagesize = "0.15.0"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
libc = "0.2"
rand = { version = "0.9.5", default-features = false, features = ["os_rng"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "http2", "charset", "json", "stream", "gzip", "brotli", "zstd"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = { version = "0.11", default-features = false }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "macros", "migrate", "uuid", "time", "json"] }
thiserror = "2"
time = { version = "0.3.54", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "fs", "io-util", "process", "sync", "time"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["trace", "compression-full", "decompression-full", "timeout", "limit", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt"] }
unicode-normalization = "0.1"
url = { version = "2", features = ["serde"] }
utoipa = { version = "5.5.0", features = ["uuid", "time"] }
utoipa-axum = "0.2.0"
uuid = { version = "1.24.0", features = ["v7", "serde"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate", "time"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
constant_time_eq = "0.5"

[workspace.dependencies.argon2]
version = "0.5.3"
